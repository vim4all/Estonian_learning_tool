<!doctype html>
<html lang="en" data-build="__BUILD__">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>EstLrn — Daily Review</title>
  <meta name="theme-color" content="#faf9f7" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#17181a" media="(prefers-color-scheme: dark)" />
  <link rel="stylesheet" href="css/style.css?v=__BUILD__" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html">Est<span>Lrn</span></a>
    <nav class="mode-nav" aria-label="Sections">
      <a class="mode-link" href="index.html"><span class="nav-icon" aria-hidden="true">📚</span><span class="nav-label">Lessons</span></a>
      <a class="mode-link" href="book.html"><span class="nav-icon" aria-hidden="true">📖</span><span class="nav-label">Book</span></a>
      <a class="mode-link active" href="review.html" aria-current="page"><span class="nav-icon" aria-hidden="true">🔁</span><span class="nav-label">Review</span></a>
      <a class="mode-link" href="quiz.html"><span class="nav-icon" aria-hidden="true">❓</span><span class="nav-label">Quiz</span></a>
      <a class="mode-link" href="practice.html"><span class="nav-icon" aria-hidden="true">✍️</span><span class="nav-label">Practice</span></a>
    </nav>
    <div class="lang-toggle" role="group" aria-label="Native language">
      <button type="button" class="lang-btn" data-lang="en">EN</button>
      <button type="button" class="lang-btn" data-lang="uk">UK</button>
    </div>
  </header>

  <div class="page-head">
    <p class="subtitle">Today's review: due words from every lesson, mixed together</p>
    <p class="streak-badge" id="streak-badge"></p>
  </div>

  <main>
    <section id="review-loading" class="lesson-picker">
      <p>Loading vocabulary…</p>
    </section>

    <section id="review" class="quiz" hidden>
      <div class="quiz-score-row">
        <span class="quiz-score" id="review-progress"></span>
        <span class="quiz-score" id="review-score"></span>
      </div>

      <div class="sentence-card quiz-card">
        <p class="quiz-direction" id="review-direction"></p>
        <p class="sentence quiz-prompt" id="review-prompt"></p>
        <p class="cloze-hint" id="review-hint" hidden></p>
        <button id="review-play-btn" aria-label="Play pronunciation" hidden>🔊 Listen</button>

        <div class="quiz-options" id="review-options"></div>

        <form id="review-type-form" class="quiz-type-form" hidden>
          <input type="text" id="review-type-input" autocomplete="off" autocapitalize="off" spellcheck="false" />
          <button type="submit" class="btn-primary">Check</button>
        </form>
        <p class="quiz-feedback" id="review-feedback" hidden></p>
      </div>

      <div class="controls">
        <button id="review-next-btn" class="btn-primary">Next &rarr;</button>
      </div>
    </section>

    <section id="review-done" class="sentence-card review-done" hidden>
      <h2 id="review-done-title"></h2>
      <p id="review-done-summary"></p>
      <div class="controls">
        <button type="button" id="review-again-btn" class="btn-primary" hidden>Review more</button>
        <a class="mode-link" href="index.html">Back to lessons</a>
      </div>
    </section>
  </main>

  <audio id="clip-audio-el"></audio>

  <script src="js/build.js?v=__BUILD__"></script>
  <script src="js/lang.js?v=__BUILD__"></script>
  <script src="js/progress.js?v=__BUILD__"></script>
  <script src="js/review.js?v=__BUILD__"></script>
</body>
</html>
