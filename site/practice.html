<!doctype html>
<html lang="en" data-build="__BUILD__">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>EstLrn — Sentence Practice</title>
  <meta name="theme-color" content="#faf9f7" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#17181a" media="(prefers-color-scheme: dark)" />
  <link rel="stylesheet" href="css/style.css?v=__BUILD__" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html">Est<span>Lrn</span></a>
    <nav class="mode-nav" aria-label="Sections">
      <a class="mode-link" href="index.html"><span class="nav-icon" aria-hidden="true">📚</span><span class="nav-label">Lessons</span></a>
      <a class="mode-link" href="book.html"><span class="nav-icon" aria-hidden="true">📖</span><span class="nav-label">Book</span></a>
      <a class="mode-link" href="review.html"><span class="nav-icon" aria-hidden="true">🔁</span><span class="nav-label">Review</span></a>
      <a class="mode-link" href="quiz.html"><span class="nav-icon" aria-hidden="true">❓</span><span class="nav-label">Quiz</span></a>
      <a class="mode-link active" href="practice.html" aria-current="page"><span class="nav-icon" aria-hidden="true">✍️</span><span class="nav-label">Practice</span></a>
    </nav>
    <div class="lang-toggle" role="group" aria-label="Native language">
      <button type="button" class="lang-btn" data-lang="en">EN</button>
      <button type="button" class="lang-btn" data-lang="uk">UK</button>
    </div>
  </header>

  <div class="page-head">
    <p class="subtitle">Sentence practice: fill in the blank, or rebuild the word order</p>
    <div class="view-toggle" role="group" aria-label="Practice mode">
      <button type="button" class="view-btn" data-mode="cloze">Fill in the blank</button>
      <button type="button" class="view-btn" data-mode="order">Word order</button>
    </div>
    <p class="streak-badge" id="streak-badge"></p>
  </div>

  <main>
    <section id="practice-loading" class="lesson-picker">
      <p>Loading sentences…</p>
    </section>

    <section id="practice" class="quiz" hidden>
      <div class="quiz-score" id="practice-score">Score: 0 / 0</div>

      <div class="sentence-card quiz-card" id="cloze-card">
        <p class="sentence cloze-sentence" id="cloze-sentence"></p>
        <button type="button" id="cloze-hint-btn">Show translation hint</button>
        <p class="cloze-hint" id="cloze-hint" hidden></p>
        <div class="quiz-options" id="cloze-options"></div>
      </div>

      <div class="sentence-card quiz-card" id="order-card" hidden>
        <p class="order-native" id="order-native"></p>
        <div class="order-answer" id="order-answer"></div>
        <div class="order-bank" id="order-bank"></div>
        <div class="controls">
          <button type="button" id="order-check-btn" class="btn-primary">Check</button>
          <button type="button" id="order-clear-btn">Clear</button>
        </div>
        <p class="quiz-feedback" id="order-feedback" hidden></p>
        <p class="sentence order-solution" id="order-solution" hidden></p>
      </div>

      <div class="controls">
        <button id="practice-next-btn" class="btn-primary">Next &rarr;</button>
      </div>
    </section>
  </main>

  <script src="js/build.js?v=__BUILD__"></script>
  <script src="js/lang.js?v=__BUILD__"></script>
  <script src="js/progress.js?v=__BUILD__"></script>
  <script src="js/practice.js?v=__BUILD__"></script>
</body>
</html>
