<!doctype html>
<html lang="en" data-build="__BUILD__">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>EstLrn — Vocabulary Quiz</title>
  <meta name="theme-color" content="#faf9f7" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#17181a" media="(prefers-color-scheme: dark)" />
  <link rel="stylesheet" href="css/style.css?v=__BUILD__" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html">Est<span>Lrn</span></a>
    <nav class="mode-nav" aria-label="Sections">
      <a class="mode-link" href="index.html"><span class="nav-icon" aria-hidden="true">📚</span><span class="nav-label">Lessons</span></a>
      <a class="mode-link" href="book.html"><span class="nav-icon" aria-hidden="true">📖</span><span class="nav-label">Book</span></a>
      <a class="mode-link" href="review.html"><span class="nav-icon" aria-hidden="true">🔁</span><span class="nav-label">Review</span></a>
      <a class="mode-link active" href="quiz.html" aria-current="page"><span class="nav-icon" aria-hidden="true">❓</span><span class="nav-label">Quiz</span></a>
      <a class="mode-link" href="practice.html"><span class="nav-icon" aria-hidden="true">✍️</span><span class="nav-label">Practice</span></a>
    </nav>
    <div class="lang-toggle" role="group" aria-label="Native language">
      <button type="button" class="lang-btn" data-lang="en">EN</button>
      <button type="button" class="lang-btn" data-lang="uk">UK</button>
    </div>
  </header>

  <div class="page-head">
    <p class="subtitle">Vocabulary quiz, 4 choices at a time</p>
    <div class="view-toggle" role="group" aria-label="Quiz mode">
      <button type="button" class="view-btn" data-mode="choice">Multiple choice</button>
      <button type="button" class="view-btn" data-mode="type">Type the translation</button>
      <button type="button" class="view-btn" data-mode="dictation">Listening dictation</button>
      <button type="button" class="view-btn" data-mode="distinguish">Listen &amp; distinguish</button>
    </div>
    <p class="streak-badge" id="streak-badge"></p>
  </div>

  <main>
    <section id="quiz-loading" class="lesson-picker">
      <p>Loading vocabulary…</p>
    </section>

    <section id="quiz" class="quiz" hidden>
      <div class="quiz-score-row">
        <span class="quiz-score" id="quiz-score">Score: 0 / 0</span>
        <label class="toggle">
          <input type="checkbox" id="due-only-toggle" />
          Only due for review
        </label>
      </div>
      <p class="due-note" id="due-note" hidden></p>

      <div class="sentence-card quiz-card">
        <p class="quiz-direction" id="quiz-direction"></p>
        <p class="sentence quiz-prompt" id="quiz-prompt"></p>
        <button id="quiz-play-btn" aria-label="Play pronunciation" hidden>🔊 Listen</button>

        <div class="quiz-options" id="quiz-options"></div>

        <form id="quiz-type-form" class="quiz-type-form" hidden>
          <input type="text" id="quiz-type-input" autocomplete="off" autocapitalize="off" spellcheck="false" />
          <button type="submit" class="btn-primary">Check</button>
        </form>
        <p class="quiz-feedback" id="quiz-feedback" hidden></p>
      </div>

      <div class="controls">
        <button id="quiz-next-btn" class="btn-primary">Next question &rarr;</button>
      </div>
    </section>
  </main>

  <audio id="clip-audio-el"></audio>

  <script src="js/build.js?v=__BUILD__"></script>
  <script src="js/lang.js?v=__BUILD__"></script>
  <script src="js/progress.js?v=__BUILD__"></script>
  <script src="js/quiz.js?v=__BUILD__"></script>
</body>
</html>
