<!doctype html>
<html lang="en" data-build="__BUILD__">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>EstLrn — Learn Estonian</title>
  <meta name="theme-color" content="#faf9f7" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#17181a" media="(prefers-color-scheme: dark)" />
  <link rel="stylesheet" href="css/style.css?v=__BUILD__" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html">Est<span>Lrn</span></a>
    <nav class="mode-nav" aria-label="Sections">
      <a class="mode-link active" href="index.html" aria-current="page"><span class="nav-icon" aria-hidden="true">📚</span><span class="nav-label">Lessons</span></a>
      <a class="mode-link" href="book.html"><span class="nav-icon" aria-hidden="true">📖</span><span class="nav-label">Book</span></a>
      <a class="mode-link" href="review.html"><span class="nav-icon" aria-hidden="true">🔁</span><span class="nav-label">Review</span></a>
      <a class="mode-link" href="quiz.html"><span class="nav-icon" aria-hidden="true">❓</span><span class="nav-label">Quiz</span></a>
      <a class="mode-link" href="practice.html"><span class="nav-icon" aria-hidden="true">✍️</span><span class="nav-label">Practice</span></a>
    </nav>
    <div class="lang-toggle" role="group" aria-label="Native language">
      <button type="button" class="lang-btn" data-lang="en">EN</button>
      <button type="button" class="lang-btn" data-lang="uk">UK</button>
    </div>
  </header>

  <div class="page-head">
    <p class="subtitle">Estonian, sentence by sentence — in English or Ukrainian</p>
    <a class="review-banner" id="review-banner" href="review.html" hidden></a>
  </div>

  <main>
    <section id="lesson-picker" class="lesson-picker">
      <label for="lesson-select">Lesson</label>
      <select id="lesson-select"></select>
      <div class="view-toggle" role="group" aria-label="View mode">
        <button type="button" class="view-btn" data-view="sentences">📖 Sentences</button>
        <button type="button" class="view-btn" data-view="vocab">🔤 Vocabulary</button>
      </div>
    </section>

    <div class="mastery-bar" id="mastery-bar" hidden>
      <div class="mastery-bar-track"><div class="mastery-bar-fill" id="mastery-bar-fill"></div></div>
      <span class="mastery-bar-label" id="mastery-bar-label"></span>
    </div>

    <section id="carousel" class="carousel" hidden>
      <div class="card-meta">
        <span class="progress" id="progress"></span>
        <button id="random-btn" class="btn-ghost btn-small" aria-label="Jump to a random sentence">🔀 Random</button>
      </div>

      <div class="sentence-card">
        <p class="topic-tag" id="topic-tag" hidden></p>
        <p class="sentence sentence-et" id="sentence-et"></p>
        <p class="sentence sentence-en" id="sentence-en"></p>
        <p class="notes" id="notes"></p>
        <div class="words" id="words"></div>
      </div>

      <div class="carousel-nav">
        <button id="prev-btn" aria-label="Previous sentence">&larr;<span class="btn-text"> Prev</span></button>
        <button id="play-sentence-btn" class="btn-primary" aria-label="Play this sentence">▶ Play sentence</button>
        <button id="next-btn" aria-label="Next sentence"><span class="btn-text">Next </span>&rarr;</button>
      </div>
      <p class="kbd-hint">Tip: <kbd>←</kbd> <kbd>→</kbd> to move, <kbd>Space</kbd> to play</p>
      <p class="swipe-hint">Swipe the card to move between sentences</p>

      <div class="shadow-controls" id="shadow-controls" hidden>
        <button type="button" id="shadow-record-btn">🎙 Record yourself</button>
        <button type="button" id="shadow-compare-btn" disabled>⇄ Compare with original</button>
        <span class="shadow-status" id="shadow-status" aria-live="polite"></span>
        <audio id="shadow-audio-el"></audio>
      </div>

      <div class="panel lesson-audio-controls">
        <p class="panel-title">Listen to the whole lesson</p>
        <div class="panel-row">
          <button id="play-lesson-btn" class="btn-primary">▶ Play full lesson</button>
          <button id="stop-btn" aria-label="Stop playback">■ Stop</button>
          <label class="toggle">
            <input type="checkbox" id="loop-toggle" />
            Loop
          </label>
        </div>
        <div class="speed-toggle" role="group" aria-label="Playback speed">
          <button type="button" class="speed-btn" data-speed="0.75">0.75x</button>
          <button type="button" class="speed-btn" data-speed="1">1x</button>
          <button type="button" class="speed-btn" data-speed="1.25">1.25x</button>
          <button type="button" class="speed-btn" data-speed="1.5">1.5x</button>
        </div>
        <audio id="lesson-audio-el"></audio>
      </div>
    </section>

    <section id="vocab-view" class="vocab-view" hidden>
      <div class="vocab-grid" id="vocab-grid"></div>
      <div class="controls vocab-pagination" id="vocab-pagination">
        <button id="vocab-prev-btn" aria-label="Previous page">&larr; Prev</button>
        <span id="vocab-page-label"></span>
        <button id="vocab-next-btn" aria-label="Next page">Next &rarr;</button>
      </div>
    </section>
  </main>

  <audio id="clip-audio-el"></audio>

  <script src="js/build.js?v=__BUILD__"></script>
  <script src="js/lang.js?v=__BUILD__"></script>
  <script src="js/speed.js?v=__BUILD__"></script>
  <script src="js/progress.js?v=__BUILD__"></script>
  <script src="js/app.js?v=__BUILD__"></script>
</body>
</html>
