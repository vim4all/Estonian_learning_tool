name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run generate-audio

      # Cache-busting: stamp the commit SHA into every page (<html data-build>, ?v= on CSS/JS) and
      # publish it as version.json, which site/js/build.js polls to reload stale pages on phones.
      - name: Stamp build version
        run: |
          BUILD="${GITHUB_SHA::12}"
          sed -i "s/__BUILD__/${BUILD}/g" site/*.html
          printf '{"build":"%s"}\n' "$BUILD" > site/version.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
